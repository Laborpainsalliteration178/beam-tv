name: Feature proposal
description: Propose a focused improvement to Beam
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This feature preserves Beam's local-first and privacy-focused direction.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user problem should Beam solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: textarea
    attributes:
      label: Platform and compatibility impact
      description: Note affected TV years, Tizen APIs, network protocols, permissions, privacy, or companion-server behavior.

