name: Bug report
description: Report a reproducible Beam problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Beam. Remove personal paths, IP addresses, server names, and private media details before submitting.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can reproduce this on the latest Beam release or current main branch.
          required: true
  - type: dropdown
    attributes:
      label: Component
      options:
        - Samsung TV app
        - Beam Companion Server
        - Landing page or documentation
        - Build or packaging
    validations:
      required: true
  - type: input
    attributes:
      label: Beam version
      placeholder: "For example: v1.0.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: TV model/year, Tizen/firmware version, or desktop OS and architecture.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Media details and logs
      description: Include container/codecs and sanitized logs when relevant. Do not upload copyrighted media.

